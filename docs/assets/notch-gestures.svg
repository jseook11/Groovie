<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Gestures available in the notch</title>
  <desc id="desc">Four gestures on the notch strip: click to play or pause, two-finger swipe to change tracks, pull down to open the record, and swipe up to bring the music app forward.</desc>

  <rect x="0.5" y="0.5" width="999" height="299" rx="24" fill="#F2E9D8" stroke="#E0D2B8"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- 1. Click -->
    <g>
      <!-- housing -->
      <path d="M42 40 H216 V82 Q216 92 206 92 H52 Q42 92 42 82 Z" fill="#0B0B0C"/>
      <circle cx="129" cy="54" r="3" fill="#242427"/>
      <circle cx="129" cy="54" r="1.2" fill="#3A3A3E"/>
      <!-- tap ripple on the housing -->
      <circle cx="129" cy="71" r="21" fill="none" stroke="#B3543D" stroke-opacity="0.10" stroke-width="2"/>
      <circle cx="129" cy="71" r="13" fill="none" stroke="#B3543D" stroke-opacity="0.22" stroke-width="2"/>
      <circle cx="129" cy="71" r="5" fill="#B3543D"/>
      <!-- pointer -->
      <path d="M158 84 L158 106 L164 100 L169 111 L174 108 L169 98 L177 98 Z" fill="#3A342B"/>
      <text x="129" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#3A342B">1 · Click</text>
      <text x="129" y="257" text-anchor="middle" font-size="12" fill="#7A6F5E">play or pause</text>
    </g>

    <!-- 2. Two-finger swipe -->
    <g>
      <path d="M292 40 H466 V82 Q466 92 456 92 H302 Q292 92 292 82 Z" fill="#0B0B0C"/>
      <circle cx="379" cy="54" r="3" fill="#242427"/>
      <circle cx="379" cy="54" r="1.2" fill="#3A3A3E"/>
      <!-- two fingertips -->
      <circle cx="363" cy="71" r="10" fill="#B3543D" fill-opacity="0.14"/>
      <circle cx="363" cy="71" r="5" fill="#B3543D"/>
      <circle cx="395" cy="71" r="10" fill="#B3543D" fill-opacity="0.14"/>
      <circle cx="395" cy="71" r="5" fill="#B3543D"/>
      <!-- horizontal travel -->
      <path d="M315 113 H443" stroke="#B3543D" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M323 105 L315 113 L323 121" fill="none" stroke="#B3543D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M435 105 L443 113 L435 121" fill="none" stroke="#B3543D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="315" y="136" text-anchor="middle" font-size="9" fill="#7A6F5E">previous</text>
      <text x="443" y="136" text-anchor="middle" font-size="9" fill="#7A6F5E">next</text>
      <text x="379" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#3A342B">2 · Swipe</text>
      <text x="379" y="257" text-anchor="middle" font-size="12" fill="#7A6F5E">two fingers · previous / next track</text>
    </g>

    <!-- 3. Pull down -->
    <g>
      <path d="M542 40 H716 V82 Q716 92 706 92 H552 Q542 92 542 82 Z" fill="#0B0B0C"/>
      <circle cx="629" cy="54" r="3" fill="#242427"/>
      <circle cx="629" cy="54" r="1.2" fill="#3A3A3E"/>
      <!-- pull gesture -->
      <path d="M615 106 H643" stroke="#B3543D" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M629 108 V144" stroke="#B3543D" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M621 136 L629 146 L637 136" fill="none" stroke="#B3543D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="629" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#3A342B">3 · Pull down</text>
      <text x="629" y="257" text-anchor="middle" font-size="12" fill="#7A6F5E">open the record</text>
    </g>

    <!-- 4. Swipe up -->
    <g>
      <path d="M792 40 H966 V82 Q966 92 956 92 H802 Q792 92 792 82 Z" fill="#0B0B0C"/>
      <circle cx="879" cy="54" r="3" fill="#242427"/>
      <circle cx="879" cy="54" r="1.2" fill="#3A3A3E"/>
      <!-- upward gesture toward the housing -->
      <path d="M865 146 H893" stroke="#B3543D" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M879 144 V108" stroke="#B3543D" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M871 116 L879 106 L887 116" fill="none" stroke="#B3543D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="879" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#3A342B">4 · Swipe up</text>
      <text x="879" y="257" text-anchor="middle" font-size="12" fill="#7A6F5E">bring the music app up</text>
    </g>

    <line x1="250" y1="60" x2="250" y2="200" stroke="#E0D2B8"/>
    <line x1="500" y1="60" x2="500" y2="200" stroke="#E0D2B8"/>
    <line x1="750" y1="60" x2="750" y2="200" stroke="#E0D2B8"/>
  </g>
</svg>
